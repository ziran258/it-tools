name: it-tools-demo
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SOURCE_REV: "${SOURCE_REV:?Set SOURCE_REV to the deployed Git commit}"
    image: "local/it-tools-demo:${SOURCE_REV:?Set SOURCE_REV}"
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
