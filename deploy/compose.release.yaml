name: it-tools-demo
services:
  web:
    image: corentinth/it-tools:2024.10.22-7ca5933@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f
    ports:
      - "0.0.0.0:${WEB_PORT:-8080}:80"
    labels:
      deployment.repository: "https://github.com/ziran258/it-tools"
      deployment.application.version: "2024.10.22-7ca5933"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
